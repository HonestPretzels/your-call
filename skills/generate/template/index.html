<title>Branch Review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,600&display=swap">
<style>
/* Layout: one reading column. Summary → plan → system map → flows → decisions → behaviour. All content comes from review.json. */
:root {
  --bg: #f6f7f9; --surface: #ffffff; --fg: #1c2230; --muted: #5d6678; --line: #dde1e8;
  --accent: #3b5bdb; --accent-bg: #eaeffd;
  --stop: #b45309; --stop-bg: #fdf3e4; --log: #0f766e; --log-bg: #e6f4f2;
  --opp: #7c3aed; --opp-bg: #f1ebfd; --warn: #b91c1c; --warn-bg: #fdecec;
  --ok: #15803d; --ok-bg: #e7f6ec; --code-bg: #f0f2f6; --add-bg: #e6f6ea; --del-bg: #fbe9e9;
  --font-display: "Fraunces", Georgia, serif;
  --font-body: "IBM Plex Sans", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12151c; --surface: #1a1f29; --fg: #e4e7ee; --muted: #9aa3b5; --line: #2c3342;
    --accent: #8ea6ff; --accent-bg: #1f2740; --stop: #f0a94b; --stop-bg: #2e2416; --log: #4fd1c0; --log-bg: #15292a;
    --opp: #b79cff; --opp-bg: #241d38; --warn: #f87171; --warn-bg: #2f1a1c; --ok: #4ade80; --ok-bg: #16291e;
    --code-bg: #222837; --add-bg: #17301f; --del-bg: #351c1e; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12151c; --surface: #1a1f29; --fg: #e4e7ee; --muted: #9aa3b5; --line: #2c3342;
  --accent: #8ea6ff; --accent-bg: #1f2740; --stop: #f0a94b; --stop-bg: #2e2416; --log: #4fd1c0; --log-bg: #15292a;
  --opp: #b79cff; --opp-bg: #241d38; --warn: #f87171; --warn-bg: #2f1a1c; --ok: #4ade80; --ok-bg: #16291e;
  --code-bg: #222837; --add-bg: #17301f; --del-bg: #351c1e; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font: 15px/1.55 var(--font-body); }
.wrap { max-width: 900px; margin: 0 auto; padding-inline: 16px; padding-block: 28px 64px; display: grid; gap: 40px; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 600; text-wrap: balance; margin: 0; }
h1 { font-size: 1.9rem; line-height: 1.2; }
h2 { font-size: 1.3rem; }
h3 { font-size: 1.05rem; }
p { margin: 0; }
a { color: var(--accent); }
button { font: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--font-mono); font-size: .85em; }
.muted { color: var(--muted); }
.eyebrow { font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.note { font-size: .85rem; color: var(--muted); max-width: 70ch; }
.banner { border: 1px dashed var(--line); border-radius: 8px; padding: 10px 14px; font-size: .85rem; color: var(--muted); }
.status-msg { padding: 40px 0; text-align: center; color: var(--muted); }

header { display: grid; gap: 12px; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 16px; color: var(--muted); font-size: .85rem; }
.summary { margin: 0; padding-left: 20px; display: grid; gap: 4px; max-width: 70ch; }
section { display: grid; gap: 14px; }
.sec-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px; display: grid; gap: 14px; min-width: 0; }
.where { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: .78rem; color: var(--muted); }
.area { font-weight: 600; color: var(--fg); background: var(--code-bg); border-radius: 4px; padding: 1px 7px; }
.id { font-family: var(--font-mono); }

/* Plan */
.plan details > summary, .group > summary { cursor: pointer; font-weight: 600; font-size: .9rem; }
.plan details > summary .muted, .group > summary .muted { font-weight: 400; }
.goal { font-size: 1.02rem; max-width: 70ch; }
.plan-lists { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px 24px; }
.plan-lists ul { margin: 6px 0 0; padding-left: 20px; display: grid; gap: 4px; font-size: .92rem; }
.built { display: grid; gap: 8px; margin-top: 10px; }
.built-row { display: grid; grid-template-columns: 96px 1fr; gap: 4px 12px; align-items: baseline; padding: 10px 12px; border: 1px solid var(--line); border-radius: 6px; }
.built-row .pill { justify-self: start; }
.built-row .what { display: grid; gap: 3px; min-width: 0; }
.built-row .as-built { font-size: .9rem; }
.built-row .refs { font-size: .78rem; color: var(--muted); }
.skel { display: grid; gap: 14px; margin-top: 10px; }
.skel-flow { display: grid; gap: 6px; }
.skel-group { border: 1px solid var(--line); border-radius: 6px; overflow: hidden; min-width: 0; }
.skel-file { display: block; font: .78rem/1.4 var(--font-mono); color: var(--muted); background: var(--code-bg); padding: 6px 12px; word-break: break-all; }
.skel-row { display: grid; grid-template-columns: 72px minmax(0, max-content) 1fr; gap: 4px 12px; align-items: baseline; padding: 8px 12px; border-top: 1px solid var(--line); }
.skel-row .sym { font: 500 .85rem/1.4 var(--font-mono); overflow-wrap: anywhere; }
.skel-row .what { font-size: .88rem; color: var(--muted); }
.kind { font-size: .7rem; font-weight: 600; text-align: center; border-radius: 999px; padding: 1px 0; }
.kind.new { background: var(--ok-bg); color: var(--ok); }
.kind.changed { background: var(--accent-bg); color: var(--accent); }
.kind.removed { background: var(--warn-bg); color: var(--warn); }
.pill { font-size: .75rem; font-weight: 600; padding: 2px 8px; border-radius: 999px; white-space: nowrap; display: inline-block; }
.pill.as-planned, .pill.test { background: var(--ok-bg); color: var(--ok); }
.pill.changed, .pill.manual-needed { background: var(--stop-bg); color: var(--stop); }
.pill.added, .pill.agent-browser { background: var(--accent-bg); color: var(--accent); }
.pill.dropped, .pill.not-covered { background: var(--warn-bg); color: var(--warn); }

/* Map */
.tier { display: grid; gap: 8px; }
.tier-row { display: flex; align-items: stretch; flex-wrap: wrap; gap: 10px; }
.node { flex: 1 1 150px; min-width: 0; text-align: left; border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 6px; padding: 10px 12px; display: grid; gap: 2px; }
button.node { cursor: pointer; }
.node.changed { background: var(--log-bg); border-color: var(--log); }
.node.contract { background: var(--stop-bg); border-color: var(--stop); }
.node.depended-on { border-style: dashed; border-color: var(--muted); }
.node.unchanged { color: var(--muted); }
.node[aria-expanded="true"] { outline: 2px solid var(--accent); outline-offset: 1px; }
.node .name { font-weight: 600; }
.node .stat { font-size: .78rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.plus { color: var(--ok); } .minus { color: var(--warn); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: .8rem; color: var(--muted); }
.swatch { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -1px; margin-right: 4px; border: 1px solid var(--line); }
.swatch.changed { background: var(--log-bg); border-color: var(--log); }
.swatch.contract { background: var(--stop-bg); border-color: var(--stop); }
.swatch.depended-on { border: 1px dashed var(--muted); }
.panel { border-top: 1px solid var(--line); padding-top: 14px; display: grid; gap: 10px; min-width: 0; }
.files { display: grid; gap: 6px; }
.file { border: 1px solid var(--line); border-radius: 6px; min-width: 0; }
.file-head { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 10px 12px; align-items: start; }
.file-path { font: .82rem/1.4 var(--font-mono); word-break: break-all; }
.file-why { grid-column: 1 / -1; font-size: .88rem; }
.file-meta { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: .78rem; color: var(--muted); align-items: center; }
.badge { font-size: .7rem; font-weight: 600; padding: 1px 7px; border-radius: 999px; letter-spacing: .03em; }
.badge.A { background: var(--ok-bg); color: var(--ok); }
.badge.M, .badge.R { background: var(--accent-bg); color: var(--accent); }
.badge.D { background: var(--warn-bg); color: var(--warn); }
.counts-n { font-variant-numeric: tabular-nums; white-space: nowrap; font-size: .8rem; }
.toggle { border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 6px; padding: 2px 10px; font-size: .78rem; cursor: pointer; }
.diff { margin: 0 12px 12px; border-radius: 6px; overflow-x: auto; background: var(--code-bg); font: .78rem/1.55 var(--font-mono); }
.diff div { padding: 0 10px; white-space: pre; }
.diff .a { background: var(--add-bg); } .diff .d { background: var(--del-bg); } .diff .h { color: var(--muted); }

/* Flows */
.flow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: .9rem; }
.step { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; }
.step.new { border-color: var(--accent); color: var(--accent); font-weight: 600; }
.arrow { color: var(--muted); }
.flow-block { display: grid; gap: 10px; }

/* Decisions */
.group { display: grid; gap: 10px; }
.area-group { display: grid; gap: 8px; margin-top: 6px; }
.tabs { display: flex; flex-wrap: wrap; gap: 4px; border-bottom: 1px solid var(--line); }
.tab { border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px; background: none; color: var(--muted); padding: 8px 12px; cursor: pointer; font-weight: 600; font-size: .92rem; display: inline-flex; gap: 6px; align-items: center; }
.tab[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
.tab .count { font-size: .75rem; font-weight: 600; background: var(--code-bg); color: var(--muted); border-radius: 999px; padding: 0 7px; font-variant-numeric: tabular-nums; }
.tab[aria-selected="true"] .count { background: var(--accent-bg); color: var(--accent); }
.list { display: grid; gap: 10px; }
.entry { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--line); border-radius: 6px; min-width: 0; }
.entry.stop { border-left-color: var(--stop); }
.entry.decision { border-left-color: var(--log); }
.entry.opportunity { border-left-color: var(--opp); }
.entry > summary { list-style: none; cursor: pointer; padding: 12px 14px; display: grid; gap: 8px; }
.entry > summary::-webkit-details-marker { display: none; }
.qa { display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; font-size: .95rem; margin: 0; }
.qa dt { font-size: .72rem; letter-spacing: .06em; text-transform: uppercase; font-weight: 600; color: var(--muted); padding-top: 3px; }
.qa dd { margin: 0; min-width: 0; }
.qa .decided { font-weight: 600; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: .72rem; padding: 2px 8px; border-radius: 999px; background: var(--code-bg); color: var(--muted); white-space: nowrap; }
.chip.stop { background: var(--stop-bg); color: var(--stop); font-weight: 600; }
.chip.decision { background: var(--log-bg); color: var(--log); font-weight: 600; }
.chip.opportunity { background: var(--opp-bg); color: var(--opp); font-weight: 600; }
.chip.history { background: var(--accent-bg); color: var(--accent); font-weight: 600; }
.body { padding: 12px 14px 14px; display: grid; gap: 12px; border-top: 1px solid var(--line); }
.detail { display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; margin: 0; font-size: .9rem; }
.detail dt { color: var(--muted); }
.detail dd { margin: 0; min-width: 0; }
.chip.marked { background: var(--accent); color: var(--surface); font-weight: 600; }
.entry.marked { box-shadow: 0 0 0 2px var(--accent); }
.mark { font-size: .85rem; padding: 5px 12px; border: 1px solid var(--accent); background: var(--surface); color: var(--accent); border-radius: 6px; cursor: pointer; }
.mark[aria-pressed="true"] { background: var(--accent); color: var(--surface); font-weight: 600; }
.mark:disabled { opacity: .6; cursor: progress; }
.entry-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.reviewed-btn { font-size: .85rem; padding: 5px 12px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 6px; cursor: pointer; }
.reviewed-btn[aria-pressed="true"] { border-color: var(--ok); background: var(--ok-bg); color: var(--ok); font-weight: 600; }
.chip.reviewed { background: var(--ok-bg); color: var(--ok); font-weight: 600; }
.entry.is-reviewed > summary { opacity: .65; }
.entry-links { display: flex; flex-wrap: wrap; gap: 12px; font-size: .8rem; color: var(--muted); }
.entry-files { display: grid; gap: 6px; }
.entry-files .file-head { padding: 8px 12px; }

/* Behaviour */
.tablewrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
table { border-collapse: collapse; width: 100%; font-size: .9rem; }
th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
th { font-size: .72rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.how { font-size: .82rem; color: var(--muted); }

@media (prefers-reduced-motion: no-preference) { .entry, .node { transition: border-color .15s, outline-color .15s; } }
@media (max-width: 560px) {
  .qa, .detail, .built-row { grid-template-columns: 1fr; }
  .skel-row { grid-template-columns: 64px 1fr; }
  .skel-row .what { grid-column: 2; }
}
</style>

<div class="wrap" id="app"><p class="status-msg">Loading the review…</p></div>

<script>
const LETTER = { plan: "P", stop: "S", decision: "D", opportunity: "O", check: "C" };
const METHOD_LABEL = { test: "Tests", "agent-browser": "Agent, in browser", "manual-needed": "Check yourself", "not-covered": "Not covered" };
const PLAN_LABEL = { "as-planned": "As planned", changed: "Changed", added: "Added", dropped: "Dropped" };
const BUILT_ORDER = ["changed", "added", "dropped", "as-planned"];
const OMIT_LABEL = { lockfile: "Lockfile, diff not shown", binary: "Binary file", generated: "Generated file", "too-large": "Diff too large to show", "over-budget": "Left out to keep the page small" };
const STATUS_LABEL = { A: "NEW", M: "MODIFIED", D: "DELETED", R: "RENAMED" };
const LAYER_KIND_LABEL = { changed: "changed", contract: "changed, includes a contract", "depended-on": "depended on, unchanged" };

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const short = sha => (sha || "").slice(0, 7);
// Older logs wrote some list fields as one string.
const asList = v => Array.isArray(v) ? v : v ? [v] : [];

let data, model;
// diffs holds open diff keys: a file path in the map panel, "<entry id>|<path>" in an entry.
// open holds the open <details>: entry ids and data-keep names.
const state = { layer: null, diffs: new Set(), open: new Set(), tab: "review" };
// Entry ids marked to discuss, kept in the page's database as marks/<entry id>.
// marksDb stays null where the database isn't available; the page still works without it.
let marksDb = null;
const marks = new Set();
// Entry ids this viewer has marked reviewed. Kept in this browser only, as their own progress.
const REVIEWED_KEY = "your-call:reviewed";
const reviewed = new Set((() => { try { return JSON.parse(localStorage.getItem(REVIEWED_KEY)) || []; } catch { return []; } })());
function toggleReviewed(id) {
  reviewed.has(id) ? reviewed.delete(id) : reviewed.add(id);
  try { localStorage.setItem(REVIEWED_KEY, JSON.stringify([...reviewed])); } catch {}
  render();
}

/** Fold supersede chains, number heads, and index everything the page looks up. */
function buildModel(d) {
  const byId = new Map(d.entries.map(e => [e.id, e]));
  const supersededBy = new Map();
  for (const e of d.entries) if (e.supersedes) supersededBy.set(e.supersedes, e.id);
  const chainOf = head => {
    const chain = [head];
    let cur = head;
    while (cur.supersedes && byId.has(cur.supersedes)) { cur = byId.get(cur.supersedes); chain.push(cur); }
    return chain; // newest first
  };
  const commitByEntry = new Map();
  for (const e of d.entries) {
    if (e.type === "commit") for (const id of e.entries || []) commitByEntry.set(id, e.sha);
  }
  const heads = d.entries.filter(e => LETTER[e.type] && !supersededBy.has(e.id));
  const items = heads.map(head => {
    const chain = chainOf(head);
    const root = chain[chain.length - 1];
    const commits = [...new Set(chain.map(c => commitByEntry.get(c.id)).filter(Boolean))];
    const files = [...new Set(chain.flatMap(c => c.files || []))];
    return { head, chain, root, commits, files };
  });
  items.sort((a, b) => (a.root.time || "").localeCompare(b.root.time || ""));
  const counters = {};
  for (const it of items) {
    const t = it.head.type;
    counters[t] = (counters[t] || 0) + 1;
    it.num = LETTER[t] + counters[t];
  }
  const numById = new Map();
  for (const it of items) for (const c of it.chain) numById.set(c.id, it.num);
  return { items, numById };
}

function commitUrl(sha) { return `${data.repo.url}/commit/${sha}`; }
function compareUrl() { return `${data.repo.url}/compare/${data.base}...${data.branch}`; }
async function fileAnchor(path) {
  try {
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(path));
    return "#diff-" + [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
  } catch (e) { return ""; }
}
const refsFor = ids => (ids || []).map(id => model.numById.get(id) || id).join(", ");
const itemsForFile = path => model.items.filter(it => it.files.includes(path)).map(it => it.num);

function renderHeader() {
  const add = data.files.reduce((n, f) => n + (f.add || 0), 0);
  const del = data.files.reduce((n, f) => n + (f.del || 0), 0);
  return `
    ${data.sample ? `<div class="banner">Sample data for testing the template. Not a real review.</div>` : ""}
    <header>
      <span class="eyebrow">Branch review</span>
      <h1>${esc(data.title || data.branch)}</h1>
      <div class="meta">
        <span class="mono">${esc(data.branch)} → ${esc(data.base)}</span>
        ${data.pr ? `<a href="${esc(data.pr.url)}">PR #${esc(data.pr.number)}</a>` : ""}
        <a href="${esc(compareUrl())}">${data.commits.length} commits</a>
        <span>${data.files.length} files · +${add} −${del}</span>
        <span>Generated ${esc(new Date(data.generated.at).toLocaleString())} by ${esc(data.generated.by)}</span>
      </div>
      <ul class="summary">${data.summary.map(s => `<li>${esc(s)}</li>`).join("")}</ul>
    </header>`;
}

function renderPlan() {
  const it = model.items.find(i => i.head.type === "plan");
  if (!it && !(data.plan_vs_built || []).length) return "";
  const p = it?.head;
  const sk = p?.skeleton;
  const groups = new Map();
  for (const item of sk?.items || []) (groups.get(item.file) || groups.set(item.file, []).get(item.file)).push(item);
  const list = (title, items) => items.length ? `<div><span class="eyebrow">${title}</span><ul>${items.map(s => `<li>${esc(s)}</li>`).join("")}</ul></div>` : "";
  const builtRows = [...(data.plan_vs_built || [])].sort((a, b) => BUILT_ORDER.indexOf(a.status) - BUILT_ORDER.indexOf(b.status));
  const builtCounts = BUILT_ORDER.map(s => [s, builtRows.filter(r => r.status === s).length]).filter(([, n]) => n);
  const extra = [
    asList(p?.builds_on).length ? `Builds on ${asList(p.builds_on).map(esc).join(", ")}` : "",
    p?.source ? `Source: <a href="${esc(p.source)}">${esc(p.source)}</a>` : "",
  ].filter(Boolean);
  return `
    <section aria-labelledby="plan-h">
      <h2 id="plan-h">Plan and what got built</h2>
      <div class="card plan">
        ${p ? `
          <div class="where"><span class="id">${it.num}</span><span class="area">Plan</span><span>agreed before implementation</span></div>
          ${p.goal ? `<p class="goal">${esc(p.goal)}</p>` : ""}
          <div class="plan-lists">${list("Scope", asList(p.scope))}${list("Out of scope", asList(p.out_of_scope))}</div>
          ${extra.length ? `<p class="note">${extra.join(" · ")}</p>` : ""}
          ${sk && ((sk.flow || []).length || (sk.items || []).length) ? `
            <details data-keep="skeleton"${state.open.has("skeleton") ? " open" : ""}>
              <summary>Agreed skeleton <span class="muted">${(sk.items || []).length} items</span></summary>
              <div class="skel">
                ${(sk.flow || []).length ? `<div class="skel-flow"><span class="eyebrow">Data flow</span><div class="flow">${sk.flow.map(s => `<span class="step">${esc(s)}</span>`).join(`<span class="arrow">→</span>`)}</div></div>` : ""}
                ${[...groups].map(([file, rows]) => `
                  <div class="skel-group">
                    <span class="skel-file">${esc(file)}</span>
                    ${rows.map(r => `<div class="skel-row"><span class="kind ${esc(r.change)}">${esc(r.change)}</span><span class="sym">${esc(r.symbol)}</span><span class="what">${esc(r.purpose)}</span></div>`).join("")}
                  </div>`).join("")}
              </div>
            </details>` : ""}` : ""}
        ${builtRows.length ? `
          <details data-keep="built"${state.open.has("built") ? " open" : ""}>
            <summary>Plan vs built <span class="muted">${builtCounts.map(([s, n]) => `${n} ${PLAN_LABEL[s].toLowerCase()}`).join(", ")}</span></summary>
            <div class="built">${builtRows.map(r => `
              <div class="built-row">
                <span class="pill ${esc(r.status)}">${PLAN_LABEL[r.status] || esc(r.status)}</span>
                <div class="what">
                  <span>${esc(r.status === "added" ? r.built : r.planned ?? "—")}</span>
                  ${r.status === "changed" || r.status === "dropped" ? `<span class="as-built muted">${r.status === "dropped" ? "Not built" : `Built: ${esc(r.built)}`}</span>` : ""}
                  ${r.note ? `<span class="as-built">${esc(r.note)}</span>` : ""}
                  ${r.settled_by?.length ? `<span class="refs">Settled by ${esc(refsFor(r.settled_by))}</span>` : ""}
                </div>
              </div>`).join("")}
            </div>
          </details>` : ""}
      </div>
    </section>`;
}

function renderMap() {
  const tiers = [...new Set(data.layers.map(l => l.tier))];
  const filesIn = id => data.files.filter(f => f.layer === id);
  const node = l => {
    const fs = filesIn(l.id);
    const add = fs.reduce((n, f) => n + (f.add || 0), 0), del = fs.reduce((n, f) => n + (f.del || 0), 0);
    const stat = fs.length ? `${fs.length} file${fs.length > 1 ? "s" : ""} · <span class="plus">+${add}</span> <span class="minus">−${del}</span>` : esc(l.note || "unchanged");
    const inner = `<span class="name">${esc(l.name)}</span><span class="stat">${stat}</span>`;
    return fs.length
      ? `<button class="node ${esc(l.kind)}" data-layer="${esc(l.id)}" aria-expanded="${state.layer === l.id}">${inner}</button>`
      : `<div class="node ${esc(l.kind)}">${inner}</div>`;
  };
  return `
    <section aria-labelledby="map-h">
      <h2 id="map-h">System map</h2>
      <p class="note">Click a highlighted layer to see each file in it, why it changed, its commits and decisions, and the diff.</p>
      <div class="card" id="map">
        ${tiers.map(t => `<div class="tier"><span class="eyebrow">${esc(t)}</span><div class="tier-row">${data.layers.filter(l => l.tier === t).map(node).join("")}</div></div>`).join("")}
        <div class="panel" id="panel" hidden></div>
      </div>
      <div class="legend">${Object.entries(LAYER_KIND_LABEL).map(([k, v]) => `<span><span class="swatch ${k}"></span>${v}</span>`).join("")}</div>
    </section>`;
}

async function renderPanel() {
  const panel = document.getElementById("panel");
  const layer = data.layers.find(l => l.id === state.layer);
  if (!layer) { panel.hidden = true; panel.innerHTML = ""; return; }
  const files = data.files.filter(f => f.layer === layer.id);
  const anchors = await Promise.all(files.map(f => fileAnchor(f.path)));
  panel.hidden = false;
  panel.innerHTML = `<h3>${esc(layer.name)}</h3><div class="files">${files.map((f, i) => {
    const nums = itemsForFile(f.path);
    const open = state.diffs.has(f.path);
    return `
    <div class="file">
      <div class="file-head">
        <span class="file-path">${esc(f.path)}</span>
        <span class="counts-n"><span class="plus">+${f.add ?? 0}</span> <span class="minus">−${f.del ?? 0}</span></span>
        ${f.why ? `<p class="file-why">${esc(f.why)}</p>` : ""}
        <div class="file-meta">
          <span class="badge ${esc(f.status)}">${STATUS_LABEL[f.status] || esc(f.status)}</span>
          ${(f.commits || []).map(c => `<a class="mono" href="${esc(commitUrl(c))}">${short(c)}</a>`).join(" ")}
          ${nums.length ? `<span>${nums.join(" ")}</span>` : ""}
          ${f.diff ? `<button class="toggle" data-diff="${esc(f.path)}" aria-expanded="${open}">${open ? "Hide diff" : "Show diff"}</button>` : ""}
          ${f.diff ? "" : `<span>${f.diff_omitted ? OMIT_LABEL[f.diff_omitted] || esc(f.diff_omitted) : "Diff not included"}</span>`}
          <a href="${esc(compareUrl() + anchors[i])}">Diff on GitHub</a>
        </div>
      </div>
      ${f.diff && open ? diffBlock(f) : ""}
    </div>`;
  }).join("")}</div>`;
}

function diffBlock(f) {
  return `<div class="diff">${f.diff.split("\n").map(l => `<div class="${l.startsWith("@@") ? "h" : l[0] === "+" ? "a" : l[0] === "-" ? "d" : ""}">${esc(l) || " "}</div>`).join("")}</div>`;
}

/** The files an entry names, each with its diff behind a toggle. Paths outside the diff are listed plainly. */
function entryFiles(it) {
  if (!it.files.length) return "";
  return `<div class="entry-files">${it.files.map(path => {
    const f = data.files.find(x => x.path === path);
    if (!f) return `<span class="file-path muted">${esc(path)}</span>`;
    const key = `${it.head.id}|${path}`;
    const open = state.diffs.has(key);
    return `
    <div class="file">
      <div class="file-head">
        <span class="file-path">${esc(path)}</span>
        <span class="counts-n"><span class="plus">+${f.add ?? 0}</span> <span class="minus">−${f.del ?? 0}</span></span>
        <div class="file-meta">
          ${f.diff ? `<button class="toggle" data-ediff="${esc(key)}" aria-expanded="${open}">${open ? "Hide diff" : "Show diff"}</button>` : `<span>${f.diff_omitted ? OMIT_LABEL[f.diff_omitted] || esc(f.diff_omitted) : "Diff not included"}</span>`}
        </div>
      </div>
      ${f.diff && open ? diffBlock(f) : ""}
    </div>`;
  }).join("")}</div>`;
}

function renderFlows() {
  if (!(data.flows || []).length) return "";
  const steps = arr => arr.map(s => typeof s === "string" ? `<span class="step">${esc(s)}</span>` : `<span class="step${s.new ? " new" : ""}">${esc(s.label)}</span>`).join(`<span class="arrow">→</span>`);
  return `
    <section aria-labelledby="flow-h">
      <h2 id="flow-h">Flows</h2>
      ${data.flows.map(f => `
        <div class="flow-block">
          <h3>${esc(f.name)}</h3>
          ${f.before?.length ? `<div><p class="eyebrow">Before</p><div class="flow">${steps(f.before)}</div></div>` : ""}
          <div><p class="eyebrow">After</p><div class="flow">${steps(f.after)}</div></div>
        </div>`).join("")}
    </section>`;
}

function entryBody(e) {
  if (e.type === "stop") return [["Options", Array.isArray(e.options) ? e.options.join(" · ") : e.options], ["Context", e.context], ["Cost to change", e.cost]];
  if (e.type === "decision") return [["Why", e.why], ["Alternatives", Array.isArray(e.alternatives) ? e.alternatives.join(" · ") : e.alternatives], ["Cost to change", e.cost]];
  if (e.type === "opportunity") return [["Why I didn't act", e.why_not_done], ["Suggested follow-up", e.follow_up], ["Effort", e.effort]];
  return [];
}

function entryCard(it) {
  const e = it.head;
  const changed = it.chain.length > 1;
  const marked = marks.has(e.id);
  const isReviewed = reviewed.has(e.id);
  return `
  <details class="entry ${e.type}${marked ? " marked" : ""}${isReviewed ? " is-reviewed" : ""}" data-entry="${esc(e.id)}"${state.open.has(e.id) ? " open" : ""}>
    <summary>
      <div class="where"><span class="id">${it.num}</span>${e.area ? `<span class="area">${esc(e.area)}</span>` : ""}<span>${esc(e.where)}</span></div>
      <dl class="qa">
        ${e.type === "opportunity"
          ? `<dt>Noticed</dt><dd>${esc(e.noticed)}</dd>`
          : `<dt>Question</dt><dd>${esc(e.question)}</dd><dt>${e.type === "stop" ? "Your call" : "Decided"}</dt><dd class="decided">${esc(e.type === "stop" ? e.answer : e.decision)}</dd>`}
      </dl>
      ${changed || marked || isReviewed || e.trigger ? `<div class="chips">
        ${isReviewed ? `<span class="chip reviewed">Reviewed</span>` : ""}
        ${e.trigger ? `<span class="chip">${esc(e.trigger)}</span>` : ""}
        ${changed ? `<span class="chip history">Changed</span>` : ""}
        ${marked ? `<span class="chip marked">Marked to discuss</span>` : ""}
      </div>` : ""}
    </summary>
    <div class="body">
      <dl class="detail">${entryBody(e).filter(([, v]) => v).map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}</dl>
      ${entryFiles(it)}
      <div class="entry-actions">
        <button class="reviewed-btn" data-reviewed="${esc(e.id)}" aria-pressed="${isReviewed}">${isReviewed ? "Reviewed" : "Mark reviewed"}</button>
        ${marksDb ? `<button class="mark" data-mark="${esc(e.id)}" aria-pressed="${marked}">${marked ? "Marked to discuss" : "Mark to discuss"}</button>` : ""}
      </div>
      <div class="entry-links">
        ${it.commits.map(c => `<a href="${esc(commitUrl(c))}">Commit <span class="mono">${short(c)}</span></a>`).join("")}
        <span>${esc(e.author)}</span>
      </div>
    </div>
  </details>`;
}

/** Entries under a heading per area, areas in order of their first entry. */
function byArea(list) {
  const groups = new Map();
  for (const it of list) {
    const area = it.head.area || "Other";
    (groups.get(area) || groups.set(area, []).get(area)).push(it);
  }
  return [...groups].map(([area, items]) => `
    <div class="area-group">
      <h3>${esc(area)} <span class="muted">${items.length}</span></h3>
      <div class="list">${items.map(entryCard).join("")}</div>
    </div>`).join("");
}

function renderDecisions() {
  const ofType = t => model.items.filter(it => it.head.type === t);
  const toReview = ofType("decision"), yourCalls = ofType("stop"), noticed = ofType("opportunity");
  if (!toReview.length && !yourCalls.length && !noticed.length) return "";
  const marked = [...toReview, ...yourCalls, ...noticed].filter(it => marks.has(it.head.id));
  const tabs = [
    { id: "review", label: "To review", items: toReview, grouped: true,
      note: `Calls made without asking you. You've reviewed ${toReview.filter(it => reviewed.has(it.head.id)).length} of ${toReview.length}.`, empty: "Nothing to review. Every call on this branch was yours." },
    { id: "calls", label: "Your calls", items: yourCalls, note: "Questions you answered while building.", empty: "No questions were asked on this branch." },
    { id: "noticed", label: "Noticed, not done", items: noticed, note: "", empty: "Nothing noticed." },
    ...(marksDb ? [{ id: "marked", label: "Marked", items: marked,
      note: "What you've marked to discuss. Run /your-call:review to go through them.", empty: "Nothing marked yet." }] : []),
  ];
  const tab = tabs.find(t => t.id === state.tab) || tabs[0];
  const body = !tab.items.length ? `<p class="muted">${tab.empty}</p>`
    : tab.grouped ? byArea(tab.items)
    : `<div class="list">${tab.items.map(entryCard).join("")}</div>`;
  return `
    <section aria-labelledby="dec-h">
      <h2 id="dec-h">Decisions</h2>
      <p class="note">${marksDb
        ? "Mark anything you want to discuss or change, then run /your-call:review."
        : "Marking isn't available in this view. Run /your-call:review and name the entries you want to discuss, like D3 or S2."}</p>
      <div class="tabs" role="tablist" aria-label="Decisions">
        ${tabs.map(t => `<button class="tab" role="tab" id="tab-${t.id}" data-tab="${t.id}" aria-controls="tabpanel" aria-selected="${t === tab}" tabindex="${t === tab ? 0 : -1}">${t.label} <span class="count">${t.items.length}</span></button>`).join("")}
      </div>
      <div class="group" role="tabpanel" id="tabpanel" aria-labelledby="tab-${tab.id}">
        ${tab.note ? `<p class="note">${tab.note}</p>` : ""}
        ${body}
      </div>
    </section>`;
}

function renderBehaviour() {
  const checks = model.items.filter(it => it.head.type === "check");
  if (!checks.length) return "";
  return `
    <section aria-labelledby="beh-h">
      <h2 id="beh-h">Behaviour</h2>
      <p class="note">What the branch should do, and how each item was checked. Rows marked "Check yourself" are for the reviewer.</p>
      <div class="tablewrap"><table>
        <thead><tr><th>Behaviour</th><th>Checked by</th><th>Details</th></tr></thead>
        <tbody>${checks.map(it => `
          <tr><td>${esc(it.head.behaviour)}</td><td><span class="pill ${esc(it.head.method)}">${METHOD_LABEL[it.head.method] || esc(it.head.method)}</span></td><td class="how">${esc(it.head.detail)}</td></tr>`).join("")}
        </tbody></table></div>
    </section>`;
}

function render() {
  document.getElementById("app").innerHTML = [
    renderHeader(), renderPlan(), renderMap(), renderFlows(), renderDecisions(), renderBehaviour(),
  ].join("");
  renderPanel();
}

document.getElementById("app").addEventListener("click", ev => {
  const node = ev.target.closest("button.node");
  if (node) { state.layer = state.layer === node.dataset.layer ? null : node.dataset.layer; render(); return; }
  const t = ev.target.closest(".toggle");
  if (t) {
    const k = t.dataset.diff ?? t.dataset.ediff;
    state.diffs.has(k) ? state.diffs.delete(k) : state.diffs.add(k);
    t.dataset.diff !== undefined ? renderPanel() : render();
    return;
  }
  const tab = ev.target.closest(".tab");
  if (tab) { state.tab = tab.dataset.tab; render(); document.getElementById(`tab-${state.tab}`)?.focus(); return; }
  const rv = ev.target.closest(".reviewed-btn");
  if (rv) { toggleReviewed(rv.dataset.reviewed); return; }
  const m = ev.target.closest(".mark");
  if (m) toggleMark(m.dataset.mark, m);
});

// Arrow keys move between the decision tabs.
document.getElementById("app").addEventListener("keydown", ev => {
  const tab = ev.target.closest?.(".tab");
  if (!tab || !["ArrowLeft", "ArrowRight"].includes(ev.key)) return;
  const all = [...document.querySelectorAll(".tab")];
  const next = all[(all.indexOf(tab) + (ev.key === "ArrowRight" ? 1 : all.length - 1)) % all.length];
  next.click();
});

// Remember which entries and sections are open so a re-render doesn't collapse them.
document.getElementById("app").addEventListener("toggle", ev => {
  const id = ev.target.dataset?.entry || ev.target.dataset?.keep;
  if (!id) return;
  ev.target.open ? state.open.add(id) : state.open.delete(id);
}, true);

async function toggleMark(id, button) {
  if (!marksDb) return;
  button.disabled = true;
  try {
    const ref = marksDb.collection("marks").doc(id);
    if (marks.has(id)) await ref.delete();
    else await ref.set({ marked_at: new Date().toISOString() });
  } catch (e) {
    button.textContent = "Couldn't save. Try again.";
  } finally {
    button.disabled = false;
  }
}

async function connectMarks() {
  const db = await window.claude?.use?.("db");
  if (!db) return;
  marksDb = db;
  render();
  db.collection("marks").onSnapshot(snap => {
    marks.clear();
    for (const doc of snap.docs) marks.add(doc.id);
    render();
  }, () => { marksDb = null; render(); });
}

fetch("review.json")
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(d => {
    data = d;
    model = buildModel(d);
    document.title = `${d.title || d.branch} review`;
    render();
    connectMarks();
  })
  .catch(() => {
    document.getElementById("app").innerHTML = `<p class="status-msg">This review's data didn't load. Ask the person who generated it to run /your-call:generate again.</p>`;
  });
</script>
